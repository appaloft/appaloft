apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: appaloft-r5c-smoke
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: appaloft-r5c-smoke
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: appaloft-r5c-smoke
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: app
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - {{ printf "echo %s > /tmp/appaloft-message; sleep 3600" (.Values.message | quote) | quote }}
          readinessProbe:
            exec:
              command: ["sh", "-c", "test -s /tmp/appaloft-message"]
            periodSeconds: 1
            timeoutSeconds: 1
