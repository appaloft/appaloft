[package]
name = "appaloft-workspace-control-tui"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "appaloft-workspace-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"
vt100 = "0.15"

[profile.release]
lto = "fat"
opt-level = "z"
panic = "abort"
strip = true
