name: Workspace Control TUI Spike

on:
  workflow_dispatch:
  push:
    branches:
      - spike/workspace-control-tui-opentui

permissions:
  contents: read

concurrency:
  group: workspace-control-tui-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terminal-session-bridge:
    name: TerminalSession bridge (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Test framework-neutral reconnect
        run: >-
          bun test
          prototypes/workspace-control-tui-opentui/terminal-session-bridge.test.ts
          prototypes/workspace-control-tui-opentui/terminal-viewport-reconnect.test.ts

  ratatui-fallback:
    name: Ratatui fallback (${{ matrix.release-target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - release-target: darwin-arm64
            os: macos-14
            rust-target: aarch64-apple-darwin
          - release-target: darwin-x64
            os: macos-15-intel
            rust-target: x86_64-apple-darwin
          - release-target: linux-arm64-gnu
            os: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-gnu
          - release-target: linux-x64-gnu
            os: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
          - release-target: linux-arm64-musl
            os: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-musl
            musl: true
          - release-target: linux-x64-musl
            os: ubuntu-22.04
            rust-target: x86_64-unknown-linux-musl
            musl: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: ${{ matrix.rust-target }}

      - name: Install musl linker
        if: ${{ matrix.musl == true }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Check formatting
        run: cargo fmt --check --manifest-path prototypes/workspace-control-tui-ratatui/Cargo.toml

      - name: Test PTY and renderer
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: >-
          cargo test
          --target ${{ matrix.rust-target }}
          --manifest-path prototypes/workspace-control-tui-ratatui/Cargo.toml

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: >-
          cargo build
          --release
          --target ${{ matrix.rust-target }}
          --manifest-path prototypes/workspace-control-tui-ratatui/Cargo.toml

      - name: Run release smoke
        run: >-
          prototypes/workspace-control-tui-ratatui/target/${{ matrix.rust-target }}/release/appaloft-workspace-control-tui-ratatui-spike
