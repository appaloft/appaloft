name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APPALOFT_APP_VERSION: 0.1.0-ci
  APPALOFT_HTTP_HOST: 127.0.0.1
  APPALOFT_HTTP_PORT: 3101
  APPALOFT_OTEL_ENABLED: "false"
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      lightweight_only: ${{ steps.classify.outputs.lightweight_only }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "lightweight_only=false" >> "$GITHUB_OUTPUT"
            echo "Workflow dispatch; running full CI."
            exit 0
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git diff --name-only "origin/${BASE_REF}...HEAD" > changed-files.txt
          elif [[ -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --name-only "${BEFORE_SHA}" "${GITHUB_SHA}" > changed-files.txt
          else
            git diff --name-only HEAD^ HEAD > changed-files.txt || git ls-files > changed-files.txt
          fi

          if [[ ! -s changed-files.txt ]]; then
            echo "lightweight_only=false" >> "$GITHUB_OUTPUT"
            echo "No changed files detected; running full CI."
            exit 0
          fi

          lightweight_only=true
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/*|docs/*|*.md|*.mdx|LICENSE|LICENSE.*)
                ;;
              *)
                lightweight_only=false
                break
                ;;
            esac
          done < changed-files.txt

          echo "lightweight_only=${lightweight_only}" >> "$GITHUB_OUTPUT"
          {
            echo "### Changed files"
            sed 's/^/- `/' changed-files.txt | sed 's/$/`/'
            echo
            echo "lightweight_only=${lightweight_only}"
          } >> "$GITHUB_STEP_SUMMARY"

  biome:
    name: Biome
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skip Biome
        if: ${{ needs.changes.outputs.lightweight_only == 'true' }}
        run: echo "Lightweight-only change; skipping Biome."

      - name: Check out code
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        uses: actions/checkout@v4

      - name: Set up Bun and caches
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        uses: ./.github/actions/setup-bun-turbo

      - name: Biome
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        run: bun run lint:ci

  typecheck:
    name: Typecheck
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skip Typecheck
        if: ${{ needs.changes.outputs.lightweight_only == 'true' }}
        run: echo "Lightweight-only change; skipping Typecheck."

      - name: Check out code
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        uses: actions/checkout@v4

      - name: Set up Bun and caches
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        uses: ./.github/actions/setup-bun-turbo

      - name: Typecheck
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        run: bun run typecheck

  unit-tests:
    name: Unit Tests
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skip Unit Tests
        if: ${{ needs.changes.outputs.lightweight_only == 'true' }}
        run: echo "Lightweight-only change; skipping unit tests."

      - name: Check out code
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        uses: actions/checkout@v4

      - name: Set up Bun and caches
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        uses: ./.github/actions/setup-bun-turbo

      - name: Unit Tests
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        run: bun run test

  integration-tests:
    name: Integration Tests
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APPALOFT_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/appaloft
    steps:
      - name: Skip Integration Tests
        if: ${{ needs.changes.outputs.lightweight_only == 'true' }}
        run: echo "Lightweight-only change; skipping integration tests."

      - name: Check out code
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        uses: actions/checkout@v4

      - name: Set up Bun and caches
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        uses: ./.github/actions/setup-bun-turbo

      - name: Start Postgres
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name appaloft-postgres \
            -e POSTGRES_DB=appaloft \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 \
            postgres:16

          for _ in {1..30}; do
            if docker exec appaloft-postgres pg_isready -U postgres -d appaloft; then
              exit 0
            fi
            sleep 2
          done

          docker logs appaloft-postgres
          exit 1

      - name: Integration Tests
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        run: bun run test:integration

      - name: Stop Postgres
        if: ${{ always() && needs.changes.outputs.lightweight_only != 'true' }}
        run: docker rm --force appaloft-postgres || true

  workspace-tui:
    name: Workspace TUI (${{ matrix.target }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-14
            bridge: true
          - target: darwin-x64
            os: macos-15-intel
          - target: linux-arm64-gnu
            os: ubuntu-24.04-arm
          - target: linux-x64-gnu
            os: ubuntu-22.04
            bridge: true
          - target: linux-arm64-musl
            os: ubuntu-24.04-arm
            musl: true
            container_platform: linux/arm64
          - target: linux-x64-musl
            os: ubuntu-22.04
            musl: true
            container_platform: linux/amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Skip Workspace TUI
        if: ${{ needs.changes.outputs.lightweight_only == 'true' }}
        run: echo "Lightweight-only change; skipping Workspace TUI checks."

      - name: Check out code
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        uses: actions/checkout@v4

      - name: Set up Bun and caches
        if: ${{ needs.changes.outputs.lightweight_only != 'true' && matrix.bridge == true }}
        uses: ./.github/actions/setup-bun-turbo

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ needs.changes.outputs.lightweight_only != 'true' && matrix.musl != true }}
        with:
          components: rustfmt

      - name: Test and build native Workspace TUI
        if: ${{ needs.changes.outputs.lightweight_only != 'true' && matrix.musl != true }}
        run: |
          cargo fmt --check --manifest-path apps/workspace-control-tui/Cargo.toml
          cargo test --locked --manifest-path apps/workspace-control-tui/Cargo.toml
          cargo build --locked --release --manifest-path apps/workspace-control-tui/Cargo.toml
          apps/workspace-control-tui/target/release/appaloft-workspace-tui --version

      - name: Test and build native musl Workspace TUI
        if: ${{ needs.changes.outputs.lightweight_only != 'true' && matrix.musl == true }}
        run: |
          docker run --rm --platform "${{ matrix.container_platform }}" \
            -v "$PWD:/work:ro" -w /work \
            rust:1.97.1-alpine3.22@sha256:df4efa4e0cdfb5245fa06e3f431387b2bcc96782ce5681b7fb6b0297d745bc29 \
            sh -c '
              CARGO_TARGET_DIR=/tmp/appaloft-workspace-tui cargo test --locked --manifest-path apps/workspace-control-tui/Cargo.toml &&
              CARGO_TARGET_DIR=/tmp/appaloft-workspace-tui cargo build --locked --release --manifest-path apps/workspace-control-tui/Cargo.toml &&
              /tmp/appaloft-workspace-tui/release/appaloft-workspace-tui --version
            '

      - name: Test Workspace TUI parent bridge
        if: ${{ needs.changes.outputs.lightweight_only != 'true' && matrix.bridge == true }}
        run: |
          bun test \
            packages/adapters/cli/test/workspace-control-native-terminal.test.ts \
            packages/adapters/cli/test/workspace-control-presentation.test.ts \
            packages/adapters/cli/test/workspace-control-real-renderer.test.ts \
            packages/adapters/cli/test/workspace-control-renderer.test.ts \
            packages/adapters/cli/test/agent-workspace-command.test.ts

  build-smoke:
    name: Build And Smoke
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APPALOFT_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/appaloft
    steps:
      - name: Skip Build And Smoke
        if: ${{ needs.changes.outputs.lightweight_only == 'true' }}
        run: echo "Lightweight-only change; skipping build and smoke checks."

      - name: Check out code
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        uses: actions/checkout@v4

      - name: Set up Bun and caches
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        uses: ./.github/actions/setup-bun-turbo

      - name: Build
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        run: bun run build

      - name: Package Release Artifacts
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        run: bun run package:artifacts

      - name: Start Postgres
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name appaloft-postgres \
            -e POSTGRES_DB=appaloft \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 \
            postgres:16

          for _ in {1..30}; do
            if docker exec appaloft-postgres pg_isready -U postgres -d appaloft; then
              exit 0
            fi
            sleep 2
          done

          docker logs appaloft-postgres
          exit 1

      - name: Binary Bundle Smoke
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        run: |
          test ! -d dist/release/appaloft-binary-bundle/web-static
          test -x dist/release/appaloft-binary-bundle/appaloft-workspace-tui
          dist/release/appaloft-binary-bundle/appaloft-workspace-tui --version
          bun run scripts/test/workspace-control-packaged-tui.ts dist/release/appaloft-binary-bundle
          mkdir -p .tmp-binary-smoke
          cd .tmp-binary-smoke
          APPALOFT_HTTP_PORT=3211 ../dist/release/appaloft-binary-bundle/run-appaloft.sh db migrate
          APPALOFT_HTTP_PORT=3211 ../dist/release/appaloft-binary-bundle/run-appaloft.sh serve > appaloft-binary.log 2>&1 &
          echo $! > appaloft-binary.pid
          cd ..
          bun run scripts/test/wait-for-http.ts http://127.0.0.1:3211/api/health 60000
          curl --fail http://127.0.0.1:3211/api/version
          curl --fail http://127.0.0.1:3211/ | grep -q "Appaloft"

      - name: Stop Binary Bundle Smoke
        if: ${{ always() && needs.changes.outputs.lightweight_only != 'true' }}
        run: |
          if [ -f .tmp-binary-smoke/appaloft-binary.pid ]; then
            kill "$(cat .tmp-binary-smoke/appaloft-binary.pid)" || true
          fi

      - name: Stop Postgres
        if: ${{ always() && needs.changes.outputs.lightweight_only != 'true' }}
        run: docker rm --force appaloft-postgres || true

      - name: Reclaim Build Artifacts Before Docker Smoke
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        run: |
          rm -rf \
            .tmp-binary-smoke \
            .turbo \
            apps/docs/.next \
            apps/docs/dist \
            apps/shell/dist \
            apps/web/.svelte-kit \
            apps/web/build \
            dist
          docker image prune --all --force
          df -h /

      - name: Docker Build Smoke
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        run: docker build -t appaloft-all-in-one:ci .

  ci:
    name: ci
    needs:
      - changes
      - biome
      - typecheck
      - unit-tests
      - integration-tests
      - build-smoke
      - workspace-tui
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required checks
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BIOME_RESULT: ${{ needs.biome.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          INTEGRATION_TESTS_RESULT: ${{ needs.integration-tests.result }}
          BUILD_SMOKE_RESULT: ${{ needs.build-smoke.result }}
          WORKSPACE_TUI_RESULT: ${{ needs.workspace-tui.result }}
        run: |
          set -euo pipefail

          failed=false
          for check in \
            "Changes:${CHANGES_RESULT}" \
            "Biome:${BIOME_RESULT}" \
            "Typecheck:${TYPECHECK_RESULT}" \
            "Unit Tests:${UNIT_TESTS_RESULT}" \
            "Integration Tests:${INTEGRATION_TESTS_RESULT}" \
            "Build And Smoke:${BUILD_SMOKE_RESULT}" \
            "Workspace TUI:${WORKSPACE_TUI_RESULT}"; do
            name="${check%%:*}"
            result="${check#*:}"
            echo "${name}: ${result}"
            if [[ "${result}" != "success" ]]; then
              failed=true
            fi
          done

          if [[ "${failed}" == "true" ]]; then
            exit 1
          fi
