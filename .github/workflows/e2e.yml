name: E2E

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APPALOFT_APP_VERSION: 0.1.0-e2e
  APPALOFT_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/appaloft
  APPALOFT_HTTP_HOST: 127.0.0.1
  APPALOFT_HTTP_PORT: 3101
  APPALOFT_E2E_EXTERNAL_SERVER: "true"
  APPALOFT_OTEL_ENABLED: "false"

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      change_class: ${{ steps.classify.outputs.change_class }}
      lightweight_only: ${{ steps.classify.outputs.lightweight_only }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Classify changed files
        id: classify
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: bun scripts/ci/classify-changed-files.ts

  e2e:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
        shard_total: [2]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: appaloft
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d appaloft"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Skip E2E
        if: ${{ needs.changes.outputs.lightweight_only == 'true' }}
        run: echo "Lightweight-only change (${{ needs.changes.outputs.change_class }}); skipping real E2E."

      - uses: actions/checkout@v4
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}

      - uses: oven-sh/setup-bun@v2
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        with:
          bun-version-file: .bun-version

      - name: Install redis-cli
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        run: |
          set -euo pipefail
          if command -v redis-cli >/dev/null 2>&1; then
            redis-cli --version
            exit 0
          fi
          docker pull redis:7-bookworm
          container="$(docker create redis:7-bookworm)"
          docker cp "${container}:/usr/local/bin/redis-cli" /tmp/redis-cli
          docker rm "${container}"
          sudo install -m 0755 /tmp/redis-cli /usr/local/bin/redis-cli
          redis-cli --version

      - name: Install
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        run: bun install --frozen-lockfile

      - name: Verify Bun version sync
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        run: bun run bun:version:check

      - name: Install Chromium For WebView
        if: ${{ needs.changes.outputs.lightweight_only != 'true' && matrix.shard == 1 }}
        working-directory: apps/web
        run: bunx playwright install chromium

      - name: Prepare Runtime Logs
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        run: mkdir -p runtime/logs

      - name: Migrate Database
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        run: bun run db:migrate

      - name: Start Appaloft Backend
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        run: |
          bun run serve > runtime/logs/e2e-server.log 2>&1 &
          echo $! > .appaloft-server.pid

      - name: Wait For Backend
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        run: bun run scripts/test/wait-for-http.ts http://127.0.0.1:3101/api/health 60000

      - name: Web WebView Smoke
        if: ${{ needs.changes.outputs.lightweight_only != 'true' && matrix.shard == 1 }}
        working-directory: apps/web
        run: bun run test:e2e

      - name: Select Shell E2E Shard
        id: shell-e2e-shard
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        run: |
          files="$(bun run scripts/test/select-shell-e2e-shard.ts --shell-root=apps/shell --shard=${{ matrix.shard }} --total=${{ matrix.shard_total }})"
          echo "files=${files}" >> "${GITHUB_OUTPUT}"
          echo "Selected shell E2E files for shard ${{ matrix.shard }}/${{ matrix.shard_total }}:"
          printf '%s\n' "${files}"

      - name: Shell CLI + HTTP E2E
        if: ${{ needs.changes.outputs.lightweight_only != 'true' }}
        working-directory: apps/shell
        run: bun test --timeout=900000 ${{ steps.shell-e2e-shard.outputs.files }}

      - name: Stop Backend
        if: ${{ always() && needs.changes.outputs.lightweight_only != 'true' }}
        run: |
          if [ -f .appaloft-server.pid ]; then
            kill "$(cat .appaloft-server.pid)" || true
          fi

      - name: Upload E2E Logs
        if: ${{ always() && needs.changes.outputs.lightweight_only != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: appaloft-e2e-logs-shard-${{ matrix.shard }}
          path: |
            runtime/logs
            apps/web/playwright-report
            apps/web/test-results
