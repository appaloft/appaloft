name: E2E

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APPALOFT_APP_VERSION: 0.1.0-e2e
  APPALOFT_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/appaloft
  APPALOFT_HTTP_HOST: 127.0.0.1
  APPALOFT_HTTP_PORT: 3101
  APPALOFT_E2E_EXTERNAL_SERVER: "true"
  APPALOFT_OTEL_ENABLED: "false"

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      change_class: ${{ steps.classify.outputs.change_class }}
      e2e_class: ${{ steps.classify.outputs.e2e_class }}
      e2e_run_shell: ${{ steps.classify.outputs.e2e_run_shell }}
      e2e_run_web: ${{ steps.classify.outputs.e2e_run_web }}
      lightweight_only: ${{ steps.classify.outputs.lightweight_only }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Classify changed files
        id: classify
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FORCE_E2E_FULL: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'e2e') }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: bun scripts/ci/classify-changed-files.ts

  # Never job-level skip: required names e2e (1, 2) and e2e (2, 2) stay Waiting
  # if this job does not start (drafts included). Echo-skip inside the shards.
  e2e:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
        shard_total: [2]
    steps:
      - name: Decide shard work
        id: shard
        env:
          E2E_CLASS: ${{ needs.changes.outputs.e2e_class }}
          E2E_RUN_SHELL: ${{ needs.changes.outputs.e2e_run_shell }}
          E2E_RUN_WEB: ${{ needs.changes.outputs.e2e_run_web }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          need_web=false
          need_shell=false
          if [[ "${E2E_RUN_WEB}" == "true" && "${SHARD}" == "1" ]]; then
            need_web=true
          fi
          if [[ "${E2E_RUN_SHELL}" == "true" ]]; then
            need_shell=true
          fi
          need_work=false
          if [[ "${need_web}" == "true" || "${need_shell}" == "true" ]]; then
            need_work=true
          fi
          {
            echo "need_web=${need_web}"
            echo "need_shell=${need_shell}"
            echo "need_work=${need_work}"
          } >> "${GITHUB_OUTPUT}"
          echo "e2e_class=${E2E_CLASS} shard=${SHARD} need_web=${need_web} need_shell=${need_shell} need_work=${need_work}"

      - name: Skip E2E
        if: ${{ steps.shard.outputs.need_work != 'true' }}
        run: echo "E2E class ${{ needs.changes.outputs.e2e_class }} (${{ needs.changes.outputs.change_class }}) on shard ${{ matrix.shard }}/${{ matrix.shard_total }}; skipping real E2E."

      - uses: actions/checkout@v4
        if: ${{ steps.shard.outputs.need_work == 'true' }}

      - uses: oven-sh/setup-bun@v2
        if: ${{ steps.shard.outputs.need_work == 'true' }}
        with:
          bun-version-file: .bun-version

      - name: Install redis-cli
        if: ${{ steps.shard.outputs.need_shell == 'true' }}
        run: |
          set -euo pipefail
          if command -v redis-cli >/dev/null 2>&1; then
            redis-cli --version
            exit 0
          fi
          docker pull redis:7-bookworm
          container="$(docker create redis:7-bookworm)"
          docker cp "${container}:/usr/local/bin/redis-cli" /tmp/redis-cli
          docker rm "${container}"
          sudo install -m 0755 /tmp/redis-cli /usr/local/bin/redis-cli
          redis-cli --version

      - name: Install
        if: ${{ steps.shard.outputs.need_work == 'true' }}
        run: bun install --frozen-lockfile

      - name: Verify Bun version sync
        if: ${{ steps.shard.outputs.need_work == 'true' }}
        run: bun run bun:version:check

      - name: Install Chromium For WebView
        if: ${{ steps.shard.outputs.need_web == 'true' }}
        working-directory: apps/web
        run: bunx playwright install chromium

      - name: Prepare Runtime Logs
        if: ${{ steps.shard.outputs.need_work == 'true' }}
        run: mkdir -p runtime/logs

      - name: Start Postgres
        if: ${{ steps.shard.outputs.need_shell == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name appaloft-postgres \
            -e POSTGRES_DB=appaloft \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 \
            postgres:16

          for _ in {1..30}; do
            if docker exec appaloft-postgres pg_isready -U postgres -d appaloft; then
              exit 0
            fi
            sleep 2
          done

          docker logs appaloft-postgres
          exit 1

      - name: Migrate Database
        if: ${{ steps.shard.outputs.need_shell == 'true' }}
        run: bun run db:migrate

      - name: Start Appaloft Backend
        if: ${{ steps.shard.outputs.need_shell == 'true' }}
        run: |
          bun run serve > runtime/logs/e2e-server.log 2>&1 &
          echo $! > .appaloft-server.pid

      - name: Wait For Backend
        if: ${{ steps.shard.outputs.need_shell == 'true' }}
        run: bun run scripts/test/wait-for-http.ts http://127.0.0.1:3101/api/health 60000

      - name: Dashboard WebView Smoke
        if: ${{ steps.shard.outputs.need_web == 'true' }}
        working-directory: apps/dashboard
        env:
          APPALOFT_DASHBOARD_EVIDENCE_DIR: ${{ runner.temp }}/appaloft-dashboard-evidence
        run: bun run test:e2e

      - name: Select Shell E2E Shard
        id: shell-e2e-shard
        if: ${{ steps.shard.outputs.need_shell == 'true' }}
        run: |
          files="$(bun run scripts/test/select-shell-e2e-shard.ts --shell-root=apps/shell --shard=${{ matrix.shard }} --total=${{ matrix.shard_total }})"
          echo "files=${files}" >> "${GITHUB_OUTPUT}"
          echo "Selected shell E2E files for shard ${{ matrix.shard }}/${{ matrix.shard_total }}:"
          printf '%s\n' "${files}"

      - name: Shell CLI + HTTP E2E
        if: ${{ steps.shard.outputs.need_shell == 'true' }}
        working-directory: apps/shell
        run: bun test --timeout=900000 ${{ steps.shell-e2e-shard.outputs.files }}

      - name: Stop Backend
        if: ${{ always() && steps.shard.outputs.need_shell == 'true' }}
        run: |
          if [ -f .appaloft-server.pid ]; then
            kill "$(cat .appaloft-server.pid)" || true
          fi

      - name: Stop Postgres
        if: ${{ always() && steps.shard.outputs.need_shell == 'true' }}
        run: docker rm --force appaloft-postgres || true

      - name: Upload E2E Logs
        if: ${{ always() && steps.shard.outputs.need_work == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: appaloft-e2e-logs-shard-${{ matrix.shard }}
          path: |
            runtime/logs
            ${{ runner.temp }}/appaloft-dashboard-evidence
